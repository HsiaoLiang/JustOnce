# Local Postgres for development: `docker compose up -d`
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: justonce
      POSTGRES_PASSWORD: justonce
      POSTGRES_DB: justonce
    ports:
      - "5432:5432"
    volumes:
      - justonce-db:/var/lib/postgresql/data
volumes:
  justonce-db:
